name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high --omit=dev

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [audit]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Comment on PR if failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const job = '${{ github.job }}';
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## ❌ Backend CI — \`${job}\` falhou\n\n[Ver logs completos](${run_url})\n\nO Developer deve verificar os logs e corrigir.`,
            });

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: [audit]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Comment on PR if failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const job = '${{ github.job }}';
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## ❌ Backend CI — \`${job}\` falhou\n\n[Ver logs completos](${run_url})\n\nO Developer deve verificar os logs e corrigir.`,
            });

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: onmyway_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onmyway_test
      JWT_SECRET: test-secret
      NODE_ENV: test
      OSRM_BASE_URL: http://router.project-osrm.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Comment on PR if failed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const job = '${{ github.job }}';
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## ❌ Backend CI — \`${job}\` falhou\n\n[Ver logs completos](${run_url})\n\nO Developer deve verificar os logs e corrigir.`,
            });

